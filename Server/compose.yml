name: drinking-backend

services:
  drinking-api:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - ${PORT}:80
    environment:
      - PORT=80
      - SECRET=${SECRET}
      - DB_FILE_PATH=/db/db.json
    volumes:
      - database-data:/db

volumes:
  database-data:
